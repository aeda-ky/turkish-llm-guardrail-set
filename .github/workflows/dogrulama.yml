name: Doğrulama

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bicim-kontrol:
    name: Biçim ve KVKK kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Örnekleri doğrula
        run: python araclar/dogrula.py
